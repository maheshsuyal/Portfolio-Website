    --bg: #0d1117;
    --panel: #131a22;
    --panel-2: #161d27;
    --border: #232b35;
    --text: #e6edf3;
    --muted: #8b96a3;
    --accent: #7ee787;   /* terminal green */
    --accent-2: #c792ea; /* purple */
    --accent-3: #79c0ff; /* blue */
    --warn: #ffcb6b;

    --body: 'Inter', sans-serif;

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    overflow-x:hidden;

  ::-webkit-scrollbar-track{background:var(--bg);}

/* ---------------- reveal-on-scroll hook ---------------- */
function useReveal() {
  const ref = useRef(null);
  const [show, setShow] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) setShow(true); });
    }, { threshold: 0.15 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, show];
}

const Reveal = ({ children, delay = 0 }) => {
  const [ref, show] = useReveal();
  return (
    <div ref={ref} className={`reveal ${show ? "show" : ""}`} style={{ transitionDelay: `${delay}ms` }}>
      {children}
    </div>
  );
};

/* ---------------- typed terminal hero ---------------- */
const TerminalHero = () => {
  const lines = [
    { p: "~/mahesh-suyal $", c: " whoami", type: "cmd" },
    { c: "Mahesh Suyal — Aspiring Software Engineer", type: "out" },
    { p: "~/mahesh-suyal $", c: " cat focus.txt", type: "cmd" },
    { c: "Python · Django · DRF · REST APIs · MySQL", type: "out" },
    { p: "~/mahesh-suyal $", c: " status", type: "cmd" },
    { c: "B.Tech CSE, 8th sem · open to Software Engineer roles", type: "out" },
  ];
  const [visible, setVisible] = useState(0);
  const [charIdx, setCharIdx] = useState(0);

  useEffect(() => {
    if (visible >= lines.length) return;
    const full = (lines[visible].p || "") + lines[visible].c;
    if (charIdx < full.length) {
      const t = setTimeout(() => setCharIdx(charIdx + 1), lines[visible].type === "cmd" ? 35 : 12);
      return () => clearTimeout(t);
    } else {
      const t = setTimeout(() => { setVisible(visible + 1); setCharIdx(0); }, 380);
      return () => clearTimeout(t);
    }
  }, [visible, charIdx]);

  return (
    <div className="term">
      <div className="term-bar">
        <span className="term-dot" style={{ background: "#ff5f56" }}></span>
        <span className="term-dot" style={{ background: "#ffbd2e" }}></span>
        <span className="term-dot" style={{ background: "#27c93f" }}></span>
        <span className="title">mahesh@portfolio — zsh</span>
      </div>
      <div className="term-body">
        {lines.slice(0, visible).map((l, i) => (
          <div key={i}>
            {l.p ? <span className="prompt">{l.p}</span> : null}
            <span style={{ color: l.type === "out" ? "#c9d1d9" : "#e6edf3" }}>{l.c}</span>
          </div>
        ))}
        {visible < lines.length && (
          <div>
            {lines[visible].p ? <span className="prompt">{lines[visible].p}</span> : null}
            <span>{((lines[visible].p || "") + lines[visible].c).slice((lines[visible].p || "").length, charIdx)}</span>
            <span className="caret"></span>
          </div>
        )}
      </div>
    </div>
  );
};

<script>
  // Manually compile the JSX source instead of relying on Babel's automatic
  // page-wide script scanner (avoids conflicts with other scripts injected
  // by hosting/preview tools).
  (function () {
    if (typeof Babel === "undefined" || typeof React === "undefined" || typeof ReactDOM === "undefined") {
      document.getElementById("root").innerHTML =
        '<div style="padding:60px;font-family:monospace;color:#e6edf3;background:#0d1117;min-height:100vh;">' +
        '<h2 style="color:#ff5f56;">Could not load required scripts (React/Babel).</h2>' +
        '<p style="color:#8b96a3;max-width:600px;">This page needs an internet connection to load React and Babel from a CDN. ' +
        'Check your connection, disable any ad-blocker/VPN restriction for this page, then refresh.</p></div>';
      return;
    }
    var source = document.getElementById("app-source").textContent;
    var compiled = Babel.transform(source, { presets: ["react"] }).code;
    var script = document.createElement("script");
    script.text = compiled;
    document.body.appendChild(script);
  })();
</script>
